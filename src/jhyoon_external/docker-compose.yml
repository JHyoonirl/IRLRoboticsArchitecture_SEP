services:
  perception:
    build:
      context: ../..
      dockerfile: src/jhyoon_external/docker/Dockerfile
    image: irl-perception:jazzy
    network_mode: host
    ipc: host
    environment:
      DISPLAY: "${DISPLAY:-:0}"
      ROS_DOMAIN_ID: "${ROS_DOMAIN_ID:-0}"
      RMW_IMPLEMENTATION: "${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}"
      YOLO_AUTOINSTALL: "false"
      YOLO_CONFIG_DIR: "/workspace/ultralytics"
      NVIDIA_VISIBLE_DEVICES: "${NVIDIA_VISIBLE_DEVICES:-all}"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility,video,graphics"
      USE_REALSENSE: "${USE_REALSENSE:-true}"
      CAMERA_MODE: "${CAMERA_MODE:-rgbd}"
      ENABLE_VISUALIZATION: "${ENABLE_VISUALIZATION:-false}"
    volumes:
      - ../../src:/workspace/ros2_ws/src:rw
      - ../../test:/workspace/ros2_ws/test:rw
      # Preserve ROS build products when the container is recreated.
      - irl_architecture_build:/workspace/ros2_ws/build
      - irl_architecture_install:/workspace/ros2_ws/install
      - irl_architecture_log:/workspace/ros2_ws/log
      - irl_ultralytics:/workspace/ultralytics
      # All implementation/runtime dependencies owned by this workstream.
      - ${JHYOON_EXTERNAL_ROOT:-.}:/workspace/jhyoon_external:rw
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # USB bus entries are created dynamically when cameras reconnect.
      - /dev/bus/usb:/dev/bus/usb:rw
    # Minimal fixed mappings. To expose all actual camera nodes, use
    # bash docker/compose-camera.sh up --force-recreate perception
    # to replace this list with the currently available camera nodes.
    devices:
      - /dev/video0:/dev/video0
      - /dev/video1:/dev/video1
      - /dev/media0:/dev/media0
      - /dev/media1:/dev/media1
      - /dev/media2:/dev/media2
    device_cgroup_rules:
      - 'c 189:* rmw'
      - 'c 81:* rmw'
      - 'c 237:* rmw'
    gpus: all
    # MobileCLIP downloads relative to cwd. Launch from the host-mounted models
    # directory so auxiliary weights survive --force-recreate as well.
    # Keep the entrypoint's cwd at ros2_ws for its optional colcon build.
    command: ["bash", "-lc", "cd /workspace/jhyoon_external/models && exec ros2 launch irl_bringup architecture.launch.py use_realsense:=$${USE_REALSENSE:-true} camera_mode:=$${CAMERA_MODE:-rgbd} enable_visualization:=$${ENABLE_VISUALIZATION:-false}"]

volumes:
  irl_architecture_build:
  irl_architecture_install:
  irl_architecture_log:
  irl_ultralytics:
